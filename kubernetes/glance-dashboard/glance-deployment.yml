apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      containers:
        - name: glance
          image: glanceapp/glance
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: glance-config
---
apiVersion: v1
kind: Service
metadata:
  name: glance
  labels:
    app: glance
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: glance

